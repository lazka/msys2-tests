name: main

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: matrix
        uses: ./gha-matrix-gen

  build:
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix: 
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    name: ${{ matrix.msystem }}-${{ matrix.cc }}
    runs-on: ${{ matrix.runner }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      FC: ${{ matrix.fc }}
    steps:
      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.packages }}

      - name: Update using staging
        run: |
          msys2 -c 'pacman -U --noconfirm "https://mirror.msys2.org/msys/x86_64/msys2-runtime-3.6.10-6-x86_64.pkg.tar.zst" "https://mirror.msys2.org/msys/x86_64/msys2-runtime-devel-3.6.10-6-x86_64.pkg.tar.zst"'

      - name: Run tests
        uses: ./
